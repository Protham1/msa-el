# TraceFlow local demo stack.
# Start: docker compose up --build
# Stop:  docker compose down
#
# Business-service health checks use TCP probes: the services trace every
# HTTP request, so an HTTP /health probe every 5s would flood Jaeger with
# one-span health traces. The API's /api/health probe is safe because the
# API only traces POST /api/demo/checkout.
name: traceflow

services:
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  inventory-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      # The five business services expect host:port for the OTLP endpoint.
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      INVENTORY_DELAY_MS: "0"
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8084"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      jaeger:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: payment-service
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      PAYMENT_DELAY_MS: "0"
      PAYMENT_FAILURE: "false"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8083"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      jaeger:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: auth-service
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      jaeger:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: order-service
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      PAYMENT_SERVICE_URL: http://payment-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8082"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      jaeger:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: gateway
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      AUTH_SERVICE_URL: http://auth-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      jaeger:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

  traceflow-api:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: traceflow-api
    environment:
      TRACEFLOW_API_PORT: "8090"
      JAEGER_QUERY_URL: http://jaeger:16686
      GATEWAY_URL: http://gateway:8080
      PAYMENT_SERVICE_URL: http://payment-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      jaeger:
        condition: service_healthy
      gateway:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      args:
        # The browser runs on the host, so this is the host-published API port.
        VITE_API_BASE_URL: http://localhost:8090
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      traceflow-api:
        condition: service_healthy
